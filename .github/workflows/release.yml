name: Build and release APK

on:
  push:
    branches:
      - claude/15-puzzle-android-game-gz5lvz
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Compute version tag
        id: vars
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk 15-puzzle-${{ steps.vars.outputs.tag }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: 15 Puzzle ${{ steps.vars.outputs.tag }}
          files: 15-puzzle-${{ steps.vars.outputs.tag }}.apk
          body: Minimalist 15-puzzle sliding game for Android. Download the APK below and install it (enable "install unknown apps" for your file manager/browser if prompted).
